[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logger"
version = "1.2.0"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2",
    "PyYAML",
]

[project.optional-dependencies]
test = ["pandas", "pytest", "pytest-cov"]

[tool.setuptools]
packages = ["logger"]

[tool.setuptools.package-dir]
"logger" = "src"