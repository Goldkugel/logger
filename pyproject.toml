[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logger"
description = "Singleton, YAML-configured logger with log levels, console colors and step timing."
readme = "README.md"
version = "1.3.0"
requires-python = ">=3.9"
authors = [{ name = "Peter Pallaoro", email = "peter.pallaoro@tum.de" }]
# The license is given as a classifier instead of an SPDX `license` field,
# since the SPDX form requires choosing between "AGPL-3.0-only" and
# "AGPL-3.0-or-later", and the LICENSE text does not state that choice.
# setuptools>=77 warns that license classifiers are deprecated, but still
# builds the package. LICENSE itself is included automatically.
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pydantic>=2",
    "PyYAML",
]

[project.optional-dependencies]
test = ["pandas", "pytest>=6", "pytest-cov"]

# The test files are named *Test.py, which pytest does not collect by
# default; with these settings a plain `pytest` finds them.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*Test.py"]

[project.urls]
Repository = "https://github.com/Goldkugel/logger"

[tool.setuptools]
packages = ["logger"]

[tool.setuptools.package-dir]
"logger" = "src"