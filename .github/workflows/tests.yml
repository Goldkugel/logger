# Runs the Logger test suite on every push and pull request and reports the
# test coverage of the package.
#
# The package is installed from the checkout (not in editable mode), so the
# run also checks that pyproject.toml declares all runtime dependencies.
# Tests are run from the repository root because they read
# ./config/config.yaml.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Pinned instead of ubuntu-latest: actions/setup-python only provides
    # Python builds per Ubuntu release, and Ubuntu 26.04 has none older than
    # 3.10. Ubuntu 24.04 still provides 3.8, the minimum in pyproject.toml.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python), the version used by the
        # pipeline (3.11) and the newest version.
        python-version: ["3.8", "3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Check that the package imports without test dependencies
        run: python -I -c "import sys, logger; assert 'pandas' not in sys.modules"

      # --cov=logger measures the installed package (the code under test),
      # term-missing lists the uncovered line numbers in the job log.
      - name: Run tests with coverage
        run: python -m pytest tests/LoggerTest.py -v --cov=logger --cov-report=term-missing

      # Also show the coverage table on the run's summary page. Runs even if
      # tests failed, as long as coverage data (.coverage) was written.
      - name: Add coverage to job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .coverage ]; then
            echo "### Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
            python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi
